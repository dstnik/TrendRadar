# ═══════════════════════════════════════════════════════════════
# TrendRadar — Celebrity News Radar (спираль интересов / celebrity pilot)
# Based on config.en.yaml (v6.10). Only English RSS sources, no Chinese hot lists.
# Edit celebrity list in: config/frequency_words.txt  (+ Google News feeds below)
# ═══════════════════════════════════════════════════════════════

app:
  timezone: "Asia/Bangkok"
  show_version_update: false

schedule:
  enabled: false
  preset: "morning_evening"

# Hot-list platforms (Chinese) — disabled by EMPTY sources list.
# NOTE: keep enabled: true — enabled: false makes the program exit before RSS crawl.
platforms:
  enabled: true
  api_url: ""
  sources: []

rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 2                 # global: 2 days; Google News / Reddit override to 1
  feeds:
    # ── Tier 1 (allowed as slide source): People, Variety, THR, Deadline, BBC (+ Reuters/AP via Google News) ──
    - id: "people"
      name: "People"
      url: "https://news.google.com/rss/search?q=site:people.com+when:2d&hl=en-US&gl=US&ceid=US:en"
      max_items: 100
    - id: "variety"
      name: "Variety"
      url: "https://variety.com/feed/"
    - id: "thr"
      name: "The Hollywood Reporter"
      url: "https://www.hollywoodreporter.com/feed/"
    - id: "deadline"
      name: "Deadline"
      url: "https://deadline.com/feed/"
    - id: "bbc-ent"
      name: "BBC Entertainment"
      url: "https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml"
    - id: "reuters-ent"
      name: "Reuters (via GNews)"
      url: "https://news.google.com/rss/search?q=site:reuters.com+(celebrity+OR+actor+OR+actress+OR+singer+OR+Hollywood)+when:2d&hl=en-US&gl=US&ceid=US:en"
      max_items: 100
    - id: "ap-ent"
      name: "AP (via GNews)"
      url: "https://news.google.com/rss/search?q=site:apnews.com+(celebrity+OR+actor+OR+actress+OR+singer+OR+Hollywood)+when:2d&hl=en-US&gl=US&ceid=US:en"
      max_items: 100

    # ── Tier 2 (signal only, NOT a slide source) ──
    - id: "eonline"
      name: "E! News"
      url: "https://www.eonline.com/syndication/feeds/rssfeeds/topstories.xml"
    - id: "usweekly"
      name: "Us Weekly"
      url: "https://www.usmagazine.com/feed/"
    - id: "pagesix"
      name: "Page Six"
      url: "https://pagesix.com/feed/"
    - id: "tmz"
      name: "TMZ"
      url: "https://www.tmz.com/rss.xml"

    # ── Social buzz (signal only) ──
    - id: "reddit-fauxmoi"
      name: "Reddit r/Fauxmoi"
      url: "https://www.reddit.com/r/Fauxmoi/.rss"
      max_age_days: 1
    - id: "reddit-popculturechat"
      name: "Reddit r/popculturechat"
      url: "https://www.reddit.com/r/popculturechat/.rss"
      max_age_days: 1

    # ── Google News per celebrity (outlet count = spread signal). Keep in sync with frequency_words.txt ──
    - id: "gn-megan-fox"
      name: "GNews: Megan Fox"
      url: "https://news.google.com/rss/search?q=%22Megan+Fox%22+when:2d&hl=en-US&gl=US&ceid=US:en"
      max_items: 100
      max_age_days: 1
    - id: "gn-taylor-swift"
      name: "GNews: Taylor Swift"
      url: "https://news.google.com/rss/search?q=%22Taylor+Swift%22+when:2d&hl=en-US&gl=US&ceid=US:en"
      max_items: 100
      max_age_days: 1
    - id: "gn-selena-gomez"
      name: "GNews: Selena Gomez"
      url: "https://news.google.com/rss/search?q=%22Selena+Gomez%22+when:2d&hl=en-US&gl=US&ceid=US:en"
      max_items: 100
      max_age_days: 1
    - id: "gn-zendaya"
      name: "GNews: Zendaya"
      url: "https://news.google.com/rss/search?q=%22Zendaya%22+when:2d&hl=en-US&gl=US&ceid=US:en"
      max_items: 100
      max_age_days: 1
    - id: "gn-kim-kardashian"
      name: "GNews: Kim Kardashian"
      url: "https://news.google.com/rss/search?q=%22Kim+Kardashian%22+when:2d&hl=en-US&gl=US&ceid=US:en"
      max_items: 100
